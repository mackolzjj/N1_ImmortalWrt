name: Build ImmortalWrt-25.12 for armsr_armv8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 1,16 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_TAG: v25.12.2
  TZ: Asia/Shanghai
  # 必须是绝对路径：OpenWrt rules.mk 会用 CONFIG_CCACHE_DIR 覆盖此值，
  # 且 env 中的 ~ 不展开；三处（env / .config / cache path）须完全一致。
  CCACHE_DIR: /workdir/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      # 清盘：删除 runner 预装的 .NET / Android SDK / CodeQL / 数据库等无关组件，腾出约 10~15GB 空间，
      # 避免后续编译内核时磁盘写满（No space left on device）导致构建失败
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get remove -y '^llvm-*' '^mysql-*' '^mongodb-*' '^dotnet-*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h /

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update > /dev/null
          # 编译依赖固定在此，构建时不再访问外部清单
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      # 跨构建保存 ccache 编译缓存：同一分支的重复构建可复用未改动源码的编译结果
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: /workdir/.ccache
          # key 带 run_id：actions/cache 不覆盖同名 key，固定 key 会让缓存永不更新
          key: ccache-n1-immortalwrt-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-n1-immortalwrt-${{ github.ref }}-
            ccache-n1-immortalwrt-

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL --single-branch --depth=1 openwrt
          cd openwrt
          git fetch --depth=1 origin tag $REPO_TAG
          git checkout $REPO_TAG
          sed -i 's/25.12-SNAPSHOT/25.12.2/g' include/version.mk
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

      # 缓存源码包下载目录：dl/ 里的 tarball 基本不变，跨构建直接复用，
      # 省掉 make download 每次重新拉取几百个包
      - name: Restore download cache
        uses: actions/cache@v6
        with:
          path: /workdir/openwrt/dl
          key: dl-n1-immortalwrt-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            dl-n1-immortalwrt-${{ github.ref }}-
            dl-n1-immortalwrt-

      # 缓存 Rust crate 索引与源码：honk 是 Rust 程序，避免每次重新拉 crates.io
      # 只缓存 registry/git，不缓存 ~/.cargo/bin（bpf-linker 由下一步单独下载）
      - name: Restore cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-n1-immortalwrt-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            cargo-n1-immortalwrt-${{ github.ref }}-
            cargo-n1-immortalwrt-

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          bash $GITHUB_WORKSPACE/armsr/armv8/diy/diy.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load N1 custom config
        run: |
          rm -rf openwrt/files openwrt/.config
          mv armsr/armv8/N1/files armsr/armv8/N1/.config openwrt/
          chmod -R 755 openwrt

      - name: Download package
        working-directory: ./openwrt
        run: |
          make defconfig
          make download -j$(( $(nproc) * 2 ))

      - name: Compile N1 firmware
        working-directory: ./openwrt
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ccache -M 5G
          ccache -z
          # 失败时用「并行 + 详细日志」重试，不再退到单线程 -j1 全量重编
          make -j$(( $(nproc) + 1 )) || make -j$(( $(nproc) )) V=s
          ccache -s

      # make defconfig 在依赖不满足时会静默丢弃 CONFIG_PACKAGE_honk=y，构建仍然
      # 成功、Release 照发，结果是刷完固件没有 honk。这里把「编出来」变成硬断言。
      - name: 断言 honk 真的进了固件
        working-directory: ./openwrt
        run: |
          set -e
          grep -q '^CONFIG_PACKAGE_honk=y' .config \
            || { echo "::error::make defconfig 丢弃了 CONFIG_PACKAGE_honk"; exit 1; }
          ls bin/targets/armsr/armv8/packages/ | grep -q '^honk_' \
            || { echo "::error::没有编出 honk 包"; exit 1; }
          tar tzf bin/targets/armsr/armv8/*rootfs.tar.gz | grep -q '^\./usr/bin/honk-core$' \
            || { echo "::error::rootfs 里没有 /usr/bin/honk-core"; exit 1; }
          echo "honk 断言通过：$(ls bin/targets/armsr/armv8/packages/ | grep '^honk_' | head -1)"

      - name: Package N1 firmware
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          openwrt_board: s905d
          # 自编译内核：开启 CONFIG_FUNCTION_TRACER / DYNAMIC_FTRACE（honk fentry UDP trace）
          kernel_repo: mackolzjj/ophub-kernel-ftrace
          kernel_usage: stable
          openwrt_kernel: 6.18.y
          auto_kernel: 'true'
          openwrt_size: 256/4096
          builder_name: Mackol

      - name: Upload firmware to release
        run: |
          set -e
          # ophub 产出的名字是 openwrt_amlogic_s905d_k<内核>_<YYYY.MM.DD>.img.gz，
          # 这里改成 ImmortalWrt 官方命名风格。后缀必须保留 .img.gz：
          # 晶晨宝盒按 amlogic_firmware_suffix 匹配资产，改了后缀在线更新就找不到包。
          src=$(ls "$PACKAGED_OUTPUTPATH"/*.img.gz | head -1)
          [ -n "$src" ] || { echo "::error::没有找到 .img.gz 产物"; exit 1; }
          kver=$(basename "$src" | sed -nE 's/.*_k([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/p')
          [ -n "$kver" ] || { echo "::error::无法从 $(basename "$src") 解析内核版本"; exit 1; }
          asset="$PACKAGED_OUTPUTPATH/immortalwrt-armsr-armv8-generic-s905d-k${kver}-${FILE_DATE}.img.gz"
          [ "$src" = "$asset" ] || mv -f "$src" "$asset"
          echo "发布资产: $(basename "$asset")  $(stat -c %s "$asset") bytes"
          tag="ImmortalWrt_${{ github.ref_name }}_${FILE_DATE}"
          gh release create $tag --repo ${{ github.repository }} --title "$tag" --notes "$(printf '首次使用建议全新刷写\n* 基本信息\nIP: 192.168.2.2\n账户: root\n密码: password')" 2> /dev/null || true
          gh release upload $tag "$asset" --repo ${{ github.repository }} --clobber

      - name: Delete old releases
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' | tail -n +11 | while read -r tag; do gh release delete "$tag" --repo ${{ github.repository }} --cleanup-tag --yes; done
